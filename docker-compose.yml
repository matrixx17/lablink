# ============================================
# LabLink AI - Docker Compose (Development)
# ============================================
# Use: docker compose up --build
# For production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ----------------------------------------
  # API Service
  # ----------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: lablink-api
    env_file: .env
    environment:
      - LOG_LEVEL=DEBUG
      - JSON_LOGS=false
      - ONTOLOGY_PATH=/app/ontology/canonical_fields.yaml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Mount source for hot reload in development
      - ./services/api:/app
      - ./parsers:/app/parsers:ro
      - ./ontology:/app/ontology:ro
    # Development command with hot reload
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - lablink-network

  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lablink-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lablink}
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lablink}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - lablink-network

  # ----------------------------------------
  # MinIO (S3-compatible storage)
  # ----------------------------------------
  minio:
    image: minio/minio:latest
    container_name: lablink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - lablink-network

  # ----------------------------------------
  # Frontend (Vite dev server)
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend/compchem-dashboard
      dockerfile: Dockerfile
    container_name: lablink-frontend
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_PROXY_TARGET=http://api:8000
    volumes:
      - ./frontend/compchem-dashboard:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - lablink-network

  # ----------------------------------------
  # Edge Agent (optional - uncomment to use)
  # ----------------------------------------
  # edge:
  #   build:
  #     context: ./edge
  #     dockerfile: Dockerfile
  #   container_name: lablink-edge
  #   env_file: .env
  #   environment:
  #     - API_BASE=http://api:8000
  #     - ORG_ID=demo-lab
  #     - WATCH_FOLDER=/incoming
  #   volumes:
  #     - ./sample_data/incoming:/incoming
  #   command: ["python", "agent.py", "--watch", "/incoming", "--api", "http://api:8000", "--org", "demo-lab"]
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: '0.25'
  #   networks:
  #     - lablink-network

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  lablink-network:
    driver: bridge
    name: lablink-network

# ----------------------------------------
# Volumes
# ----------------------------------------
volumes:
  pgdata:
    name: lablink-pgdata
  minio-data:
    name: lablink-minio-data
