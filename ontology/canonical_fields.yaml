# Canonical Lab Fields Ontology
# Each field has a canonical name and a list of common synonyms/variants
# Used for embedding-based semantic matching of CSV headers

fields:
  # Time & Duration
  time:
    description: "Time point or timestamp"
    synonyms:
      - time
      - timestamp
      - timepoint
      - time point
      - t
      - elapsed time
      - run time
      - duration
      - time (min)
      - time (s)

  time_minutes:
    description: "Time in minutes"
    synonyms:
      - minutes
      - min
      - mins
      - time (min)
      - time min
      - elapsed minutes

  time_seconds:
    description: "Time in seconds"
    synonyms:
      - seconds
      - sec
      - secs
      - time (s)
      - time sec
      - elapsed seconds

  time_hours:
    description: "Time in hours"
    synonyms:
      - hours
      - hr
      - hrs
      - time (hr)
      - time hours
      - elapsed hours

  # Temperature
  temperature_celsius:
